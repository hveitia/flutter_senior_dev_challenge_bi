name: module_kit
description: >-
  The contract between the domain packages and the home of Banca Digital:
  the module registry, the host a module reports to and the destinations an
  action may open.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # Only for the import boundary check shared by every package.
  app_platform: ^0.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
